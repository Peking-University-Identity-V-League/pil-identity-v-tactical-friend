<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script>
/* 主题尽早落地避免闪烁：手动选择优先，默认暗色 */
try {
  var _t = localStorage.getItem('pil-theme') || 'dark';
  document.documentElement.dataset.theme = _t;
} catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="https://patchwiki.biligame.com/images/dwrg/thumb/9/92/0xd8ech9g51s7zz2ngvasxjduvak6cd.png/90px-%E8%A1%A8%E6%83%85%E5%9B%BE%E6%A0%87_%E6%9C%9F%E5%BE%85.png">
<title data-i18n="ui.title"></title>
<link rel="stylesheet" href="css/style.css">
<!-- 首屏关键模块预加载：浏览器解析 HTML 时即并行下载，不必等语言包加载完成。
     tactic.js 故意不在此列——进入战术面板时才按需加载。 -->
<link rel="modulepreload" href="js/bootstrap.js">
<link rel="modulepreload" href="js/main.js">
<link rel="modulepreload" href="js/region.js">
<link rel="modulepreload" href="js/shell.js">
<link rel="modulepreload" href="js/deduce.js">
<link rel="modulepreload" href="js/data/maps.js">
<link rel="modulepreload" href="js/core/dom.js">
<link rel="modulepreload" href="js/core/i18n.js">

</head>
<body>
<div class="bg-noise"></div>
<div class="particles" id="particles"></div>

<div class="header" id="appHeader">
  <div class="header-nav">
    <div class="back-btn" id="backHomeBtn" style="display:none;"
      title="" aria-label="" data-i18n-attributes="{&quot;title&quot;:&quot;ui.backHome.button.message&quot;,&quot;aria-label&quot;:&quot;ui.backHome.button.message&quot;}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </div>
    <div class="tab-bar" id="tabBar" style="display:none;">
      <button class="tab-btn" data-tab="tactic" data-i18n="ui.nav.tac.label"></button>
      <button class="tab-btn active" data-tab="region" data-i18n="ui.nav.sel.label"></button>
      <button class="tab-btn" data-tab="deduce" data-i18n="ui.nav.ded.label"></button>
    </div>
  </div>
  <div class="header-right">
  <div class="tac-top-tools" id="tacTopTools">
      <button class="tac-tool active" data-tool="select" data-i18n="ui.tac.tool.choose"></button>
      <button class="tac-tool" data-tool="roles" data-i18n="ui.tac.tool.role"></button>
      <button class="tac-tool" data-tool="draw" data-i18n="ui.tac.tool.draw"></button>
      <button class="tac-tool" data-tool="measure" data-i18n="ui.tac.tool.measure"></button>
      <button class="tac-tool" data-tool="deduce" data-i18n="ui.tac.tool.calculation"></button>
      <button class="tac-tool" data-tool="anim" data-i18n="ui.tac.tool.anim"></button>
      <span class="tac-top-tools-sep"></span>
      <button class="tac-tool" data-tool="display" data-i18n="ui.tac.tool.setting"></button>
      <button class="tac-tool" data-tool="delete" data-i18n="ui.tac.tool.delete"></button>
      <button class="tac-tool" id="tacUndoBtn" disabled data-i18n="ui.tac.tool.undo"></button>
      <button class="tac-tool" id="tacExportBtn" data-i18n="ui.tac.tool.export"></button>
  </div>
  <button type="button" class="theme-toggle" id="themeToggle" aria-label="theme">🌙</button>
  <div class="header-lang">
    <button class="footer-lang-btn" id="footerLangBtn" type="button" aria-haspopup="true" aria-expanded="false"
      title="" data-i18n-attributes="{&quot;title&quot;:&quot;ui.footer.language.message&quot;}"><span id="footerLangCurrent">简体中文</span><span class="footer-lang-arrow">▾</span></button>
    <div class="footer-lang-menu" id="footerLangMenu" role="menu" hidden></div>
  </div>
  </div>
  <div class="header-title">
    <h1 id="pageTitle" data-i18n="ui.title"></h1>
    <div class="subtitle" id="pageSubtitle">Identity V Tactical Friend</div>
  </div>
</div>

<div class="main-container">

  
  <div class="view active" id="homeView">
    <div class="home-map-grid" id="homeMapGrid"></div>
  </div>


  
  <div class="view tactic-view" id="tacticView">
  <div class="content-grid">
    <div class="main-left">
      <div class="top-bar">
        <div class="map-title-group">
          <div class="map-title" id="tacMapTitle" data-i18n="maps.theRedChurch.mapName"></div>
          <div class="map-title-en" id="tacMapTitleEn">The Red Church</div>
        </div>
        <div class="tac-zoom" id="tacZoom">
          <button class="tac-zoom-btn tac-zoom-lock" id="tacZoomLock" type="button"
            title="" data-i18n-attributes="{&quot;title&quot;:&quot;ui.tac.map.zoomLock.message2&quot;}"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg></button>
          <button class="tac-zoom-btn" id="tacZoomOut" type="button" title="" disabled data-i18n-attributes="{&quot;title&quot;:&quot;ui.tac.map.zoomOut.message&quot;}">−</button>
          <span class="tac-zoom-val" id="tacZoomVal">100%</span>
          <button class="tac-zoom-btn" id="tacZoomIn" type="button" title="" data-i18n="ui.tac.map.zoomIn.button" data-i18n-attributes="{&quot;title&quot;:&quot;ui.tac.map.zoomIn.message&quot;}"></button>
          <button class="tac-zoom-btn tac-zoom-pan" id="tacZoomPan" type="button"
            title="" disabled data-i18n-attributes="{&quot;title&quot;:&quot;ui.tac.map.zoomPan.message&quot;}">✋</button>
          <button class="tac-zoom-btn tac-zoom-rot" id="tacRotateBtn" type="button"
            title="" data-i18n-attributes="{&quot;title&quot;:&quot;ui.tac.map.rotate.message&quot;}"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
        </div>
        <div class="map-view-actions">
          <button type="button" class="reset-btn map-3d-button" data-map-3d data-i18n="ui.map3d.open" title="切换当前地图；同步选中或最近测距线的起终点">切换三维</button>
          <button class="reset-btn" id="tacClearBtn" data-i18n="ui.tac.nav.clear.button"></button>
        </div>
      </div>

      <div class="map-viewer">
        <div class="map-container">
          <div class="ded-map-wrap tac-map-wrap" id="tacMapWrap">
            <div class="tac-rot" id="tacRot">
              <img id="tacMapImage" class="map-image" alt="" draggable="false"  data-i18n-attributes="{&quot;alt&quot;:&quot;common.map&quot;}"/>
              <svg class="tac-arrow-svg" id="tacArrowSvg" aria-hidden="true"></svg>
            </div>
            <div class="tac-snap-ripple" id="tacSnapRipple" aria-hidden="true"></div>
            <div class="tac-coords-tip" id="tacCoordsTip" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="ded-panel tac-panel" id="tacPanel">
      
      <details class="ded-card" id="tacManageCard" open>
        <summary>
          <span class="ded-sec-title" style="margin-bottom:0">
            <span class="ded-sec-zh" data-i18n="ui.tac.creation.title"></span>
            <span class="ded-sec-en" data-i18n-en="ui.tac.creation.title"></span>
          </span>
          <span class="arrow">▶</span>
        </summary>
        <div class="tac-manage-list" id="tacManageList" style="margin-top:12px"></div>
      </details>

      <details class="ded-card" id="tacCipherCard" style="display:none">
        <summary>
          <span class="ded-sec-title" style="margin-bottom:0">
            <span class="ded-sec-zh" data-i18n="ui.tac.cipherCard.title"></span>
            <span class="ded-sec-en" data-i18n-en="ui.tac.cipherCard.title"></span>
          </span>
          <span class="arrow">▶</span>
        </summary>
        <div style="margin-top:12px">
          <div class="tac-manage-entry">
            <div class="tac-manage-head"><label class="tac-display-toggle tac-head-toggle"><input type="checkbox" id="tacCipherCardShow" checked><span data-i18n="common.cipherMachine"></span></label></div>
            <div class="tac-manage-row tac-display-row">
              <span class="tac-display-mid">
                <span class="switch-btn" id="tacCipherCardPrev" role="button" title="" data-i18n-attributes="{&quot;title&quot;:&quot;ui.tac.display.cipher.layout.prev.message&quot;}">‹</span>
                <span class="tac-display-text" id="tacCipherCardText"></span>
                <span class="switch-btn" id="tacCipherCardNext" role="button" title="" data-i18n-attributes="{&quot;title&quot;:&quot;ui.tac.display.cipher.layout.next.message&quot;}">›</span>
                <label class="tac-display-toggle"><input type="checkbox" id="tacCipherCardAll"><span data-i18n="common.all"></span></label>
                <label class="tac-display-toggle" id="tacCipherCardDuoWrap" style="display:none"><input type="checkbox" id="tacCipherCardDuo"><span data-i18n="ui.tac.display.cipher.duoHunters"></span></label>
              </span>
              <label class="tac-manage-slider"><span data-i18n="application.common.icon.size"></span><input type="range" id="tacCipherCardSize" min="3" max="12" step="0.5" value="6"></label>
              <label class="tac-manage-def"><input type="checkbox" id="tacCipherCardSizeDef" checked><span data-i18n="common.default"></span></label>
            </div>
          </div>
          <div class="tac-carry-sep"></div>
          <div id="tacCipherList"></div>
        </div>
      </details>

      
      <details class="ded-card" id="tacDrawCard" style="display:none" open>
        <summary>
          <span class="ded-sec-title" style="margin-bottom:0">
            <span class="ded-sec-zh" data-i18n="ui.tac.pattern.title"></span>
            <span class="ded-sec-en" data-i18n-en="ui.tac.pattern.title"></span>
          </span>
          <span class="arrow">▶</span>
        </summary>
        <div style="margin-top:12px">
        <div class="tac-shapes" id="tacShapes">
          <button class="tac-shape" data-shape="line" data-i18n="ui.tac.pattern.line"></button>
          <button class="tac-shape active" data-shape="arrow" data-i18n="ui.tac.pattern.arrow"></button>
          <button class="tac-shape" data-shape="circle" data-i18n="ui.tac.pattern.circle"></button>
          <button class="tac-shape" data-shape="rect" data-i18n="ui.tac.pattern.square"></button>
        </div>

        <div class="tac-detail">
          <div class="tac-detail-head">
            <button type="button" class="tac-detail-toggle" id="tacShapeStyleToggle"></button>
          </div>
          <div class="tac-detail-body" id="tacShapeStyleBody">
            <div class="tac-style-flex">
          <span data-i18n="application.common.color"></span>
          <div class="tac-colors" id="tacColors">
            <button class="tac-color active" data-color="#ef4444" style="--c:#ef4444" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.red&quot;}"></button>
            <button class="tac-color" data-color="#f97316" style="--c:#f97316" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.orange&quot;}"></button>
            <button class="tac-color" data-color="#eab308" style="--c:#eab308" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.yellow&quot;}"></button>
            <button class="tac-color" data-color="#22c55e" style="--c:#22c55e" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.green&quot;}"></button>
            <button class="tac-color" data-color="#3b82f6" style="--c:#3b82f6" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.blue&quot;}"></button>
            <button class="tac-color" data-color="#a855f7" style="--c:#a855f7" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.purple&quot;}"></button>
            <button class="tac-color" data-color="#f1f5f9" style="--c:#f1f5f9" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.white&quot;}"></button>
            <button class="tac-color" data-color="#0f172a" style="--c:#0f172a" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.black&quot;}"></button>
          </div>
          <span class="tac-width-group"><span data-i18n="application.common.strokeWidth"></span><input type="range" id="tacWidth" min="2" max="8" step="1" value="2" /><span class="tac-width-val" id="tacWidthVal">2</span></span>
            </div>
          </div>
        </div>
        </div>
      </details>

      
      <details class="ded-card" id="tacTextCard" style="display:none" open>
        <summary>
          <span class="ded-sec-title" style="margin-bottom:0">
            <span class="ded-sec-zh" data-i18n="ui.tac.text.title"></span>
            <span class="ded-sec-en" data-i18n-en="ui.tac.text.title"></span>
          </span>
          <span class="arrow">▶</span>
        </summary>
        <div style="margin-top:12px">
        <div class="tac-text-add">
          <input type="text" id="tacTextInput" maxlength="60"
            placeholder=""  data-i18n-attributes="{&quot;placeholder&quot;:&quot;ui.tac.text.input.placeholder&quot;}"/>
          <button class="tac-text-add-btn" id="tacTextAddBtn" data-i18n="ui.tac.text.add.button"></button>
        </div>
        <div class="tac-text-hint" id="tacTextHint" data-i18n="ui.tac.text.note"></div>

        <div class="tac-detail">
          <div class="tac-detail-head">
            <button type="button" class="tac-detail-toggle" id="tacTextStyleToggle"></button>
          </div>
          <div class="tac-detail-body" id="tacTextStyleBody">
            <div class="tac-style-flex">
          <span data-i18n="application.common.color"></span>
          <div class="tac-colors" id="tacTextColors">
            <button class="tac-color" data-color="#ef4444" style="--c:#ef4444" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.red&quot;}"></button>
            <button class="tac-color" data-color="#f97316" style="--c:#f97316" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.orange&quot;}"></button>
            <button class="tac-color" data-color="#eab308" style="--c:#eab308" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.yellow&quot;}"></button>
            <button class="tac-color" data-color="#22c55e" style="--c:#22c55e" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.green&quot;}"></button>
            <button class="tac-color" data-color="#3b82f6" style="--c:#3b82f6" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.blue&quot;}"></button>
            <button class="tac-color" data-color="#a855f7" style="--c:#a855f7" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.purple&quot;}"></button>
            <button class="tac-color active" data-color="#f1f5f9" style="--c:#f1f5f9" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.white&quot;}"></button>
            <button class="tac-color" data-color="#0f172a" style="--c:#0f172a" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.black&quot;}"></button>
          </div>
          <span data-i18n="application.common.fontSize"></span>
          <input type="range" id="tacTextSize" min="6" max="36" step="1" value="12" />
          <span class="tac-width-val" id="tacTextSizeVal">12</span>
            </div>
          </div>
        </div>

        <div class="tac-sec-label"
          style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)" data-i18n="ui.tac.text.add.title"></div>
        <div class="tac-text-list" id="tacTextList"></div>
        </div>
      </details>

      
      <details class="ded-card" id="tacMeasureCard" style="display:none" open>
        <summary>
          <span class="ded-sec-title" style="margin-bottom:0">
            <span class="ded-sec-zh" data-i18n="ui.tac.measure.title"></span>
            <span class="ded-sec-en" data-i18n-en="ui.tac.measure.title"></span>
          </span>
          <span class="arrow">▶</span>
        </summary>
        <div style="margin-top:12px">
        <div class="side-toggle tac-mmodes" id="tacMeasureModes">
          <button class="side-btn active" data-mmode="single" data-i18n="ui.tac.measure.line.straightline.button"></button>
          <button class="side-btn" data-mmode="chain" data-i18n="ui.tac.measure.line.polyline.button"></button>
          <button class="side-btn" data-mmode="route" data-i18n="ui.tac.measure.line.routeline.button"></button>
        </div>

        <div class="tac-sec-label tac-speed-title">
          <button type="button" class="tac-deselect" id="tacMeasureCancel" style="display:none" data-i18n="ui.tac.measure.draw.disarm"></button>
          <button type="button" class="tac-deselect" id="tacDeselect" data-i18n="ui.tac.measure.line.choose"></button>
          <span class="tac-status" id="tacStatus"></span>
          <span class="tac-status2" id="tacStatus2"></span>
        </div>
        <div class="tac-carry-sep"></div>
        <div class="tac-detail">
          <div class="tac-detail-head">
            <button type="button" class="tac-detail-toggle tac-lvl1" id="tacDrawSettingsToggle"></button>
          </div>
          <div class="tac-detail-body" id="tacDrawSettingsBody" style="display:none">
            <div class="tac-detail">
              <div class="tac-detail-head">
                <button type="button" class="tac-detail-toggle" id="tacDrawStyleToggle"></button>
              </div>
              <div class="tac-detail-body" id="tacMStyleBody">
                <div class="tac-style-flex">
                  <span data-i18n="application.common.color"></span>
                  <div class="tac-colors" id="tacMeasureColors">
              <button class="tac-color" data-color="#ef4444" style="--c:#ef4444" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.red&quot;}"></button>
              <button class="tac-color" data-color="#f97316" style="--c:#f97316" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.orange&quot;}"></button>
              <button class="tac-color" data-color="#eab308" style="--c:#eab308" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.yellow&quot;}"></button>
              <button class="tac-color" data-color="#22c55e" style="--c:#22c55e" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.green&quot;}"></button>
              <button class="tac-color" data-color="#3b82f6" style="--c:#3b82f6" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.blue&quot;}"></button>
              <button class="tac-color" data-color="#a855f7" style="--c:#a855f7" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.purple&quot;}"></button>
              <button class="tac-color" data-color="#f1f5f9" style="--c:#f1f5f9" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.white&quot;}"></button>
              <button class="tac-color" data-color="#0f172a" style="--c:#0f172a" title="" data-i18n-attributes="{&quot;title&quot;:&quot;colors.black&quot;}"></button>
            </div>
                  <span class="tac-width-group"><span data-i18n="application.common.strokeWidth"></span><input type="range" id="tacMeasureWidth" min="2" max="8" step="1" value="2" /><span class="tac-width-val" id="tacMeasureWidthVal">2</span></span>
                </div>
              </div>
            </div>
            <div class="tac-detail">
              <div class="tac-detail-head">
                <button type="button" class="tac-detail-toggle" id="tacDrawOtherToggle"></button>
              </div>
              <div class="tac-detail-body" id="tacDrawOtherBody">
                <div class="tac-display-snap no-line">
                  <span class="tac-display-snap-label" data-i18n="ui.tac.measure.setting.draw.autoSnap.button"></span>
                  <label class="tac-display-toggle"><input type="checkbox" id="tacSnapDoor" checked><span data-i18n="common.escapeDoor"></span></label>
                  <label class="tac-display-toggle"><input type="checkbox" id="tacSnapCipher" checked><span data-i18n="common.cipherMachine"></span></label>
                  <label class="tac-display-toggle"><input type="checkbox" id="tacSnapDungeon" checked><span data-i18n="common.dungeon"></span></label>
                  <label class="tac-display-toggle"><input type="checkbox" id="tacSnapChair" checked><span data-i18n="common.rocketChair"></span></label>
                  <label class="tac-display-toggle"><input type="checkbox" id="tacSnapLocker"><span data-i18n="common.locker"></span></label>
                  <label class="tac-display-toggle"><input type="checkbox" id="tacSnapBox"><span data-i18n="common.box"></span></label>
                  <label class="tac-display-toggle"><input type="checkbox" id="tacSnapPhoneBooth"><span data-i18n="common.phoneBooth"></span></label>
                  <label class="tac-display-toggle" title="" data-i18n-attributes="{&quot;title&quot;:&quot;ui.tac.measure.setting.draw.autoSnap.button.message&quot;}"><input type="checkbox" id="tacSnapPoint" checked><span data-i18n="common.endpoint"></span></label>
                </div>
                <div class="tac-display-snap no-line">
                  <label class="tac-display-toggle"><input type="checkbox" id="tacShowEndpoints"><span data-i18n="ui.tac.measure.setting.draw.showEndpoints"></span></label>
                  <label class="tac-display-toggle"><input type="checkbox" id="tacShowDist" checked><span data-i18n="ui.tac.measure.setting.draw.showDist"></span></label>
                  <label class="tac-display-toggle"><input type="checkbox" id="tacShowTime"><span data-i18n="ui.tac.measure.setting.draw.showTime"></span></label>
                  <label class="tac-display-toggle" title="" data-i18n-attributes="{&quot;title&quot;:&quot;ui.tac.measure.setting.draw.deleteSingle.button.message&quot;}"><input type="checkbox" id="tacDelSegOnly"><span data-i18n="ui.tac.measure.setting.draw.deleteSingle.button"></span></label>
                  <label class="tac-display-toggle" id="tacMeasureVaultWrap" title="" data-i18n-attributes="{&quot;title&quot;:&quot;ui.tac.path.result.note&quot;}"><input type="checkbox" id="tacMeasureVault" checked><span data-i18n="ui.tac.path.setting.vaultAllow"></span></label>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="tac-carry-sep"></div>
