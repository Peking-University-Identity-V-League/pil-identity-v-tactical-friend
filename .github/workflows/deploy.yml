name: Check and deploy tactical friend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tactical-friend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'

      - name: Install pinned test tooling
        run: npm ci --ignore-scripts

      - name: Test application and deployment code
        run: |
          npm test
          npm --prefix deploy test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser behavior
        run: npm run test:e2e

      - name: Package this checkout
        env:
          DEPLOY_CONFIG_REVISION: ${{ github.sha }}
        run: npm --prefix deploy run build

      - name: Save static release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tactical-static-${{ github.sha }}
          path: deploy/dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Publish production
    needs: validate
    if: github.repository == 'Peking-University-Identity-V-League/pil-identity-v-tactical-friend' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://pkuidv.com/tactical-friend/
    defaults:
      run:
        working-directory: deploy
    steps:
      - name: Check out publishing code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'

      - name: Download validated static release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tactical-static-${{ github.sha }}
          path: deploy/dist/

      - name: Publish and verify release
        env:
          CST_HOST: ${{ secrets.CST_HOST }}
          CST_DEPLOY_TOKEN: ${{ secrets.CST_DEPLOY_TOKEN }}
        run: node scripts/deploy.mjs

      - name: Check public application paths
        run: node scripts/verify-live.mjs
